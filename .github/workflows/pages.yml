# Deploys the repository root to GitHub Pages on every push to main, and on demand
# (Actions > Deploy to GitHub Pages > Run workflow). Replaces the automatic
# "deploy from a branch" build, which stopped being queued on pushes on 2026-10-04.
# Settings > Pages > Source must be "GitHub Actions" for this to publish.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
